apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-app-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: shop-app
      rules:
        - alert: ShopAppDown
          expr: absent(up{job="shop-app"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ShopApp has no healthy pods"
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ShopApp returning many 5xx errors"
